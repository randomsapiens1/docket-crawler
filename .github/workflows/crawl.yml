name: Weekly Crawl

on:
  schedule:
    # 2am Bangladesh time = 8pm UTC Sunday
    - cron: '0 20 * * 0'
  workflow_dispatch:
    inputs:
      domains:
        description: 'Comma-separated domains to crawl (e.g. pmo.gov.bd,mof.gov.bd). Leave empty to crawl all.'
        default: ''
        required: false
      batch_total:
        description: 'Number of parallel batches (ignored when domains is set)'
        default: '5'
        required: false

jobs:
  crawl:
    name: Crawl batch ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        if: inputs.domains == '' || matrix.batch == 0
        run: npx playwright install chromium --with-deps
        working-directory: apps/worker

      - name: Run crawler
        if: inputs.domains == '' || matrix.batch == 0
        run: npm run crawl
        working-directory: apps/worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BATCH_INDEX: ${{ matrix.batch }}
          BATCH_TOTAL: ${{ inputs.domains != '' && inputs.domains != null && '1' || inputs.batch_total || '5' }}
          DOMAINS: ${{ inputs.domains }}
          MAX_PAGES_PER_SITE: '10'
          GITHUB_RUN_ID: ${{ github.run_id }}-${{ matrix.batch }}
